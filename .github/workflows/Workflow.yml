name: CI-CD Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: cacheing 
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cash_2

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest test/


  build:
    name: Build Project
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: cacheing 
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cash_2
      
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build Script
        run: python build_output.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-csv-files
          path: artifact/

  deploy:
    name: Deploy to MongoDB
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: cacheing 
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cash_2

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: built-csv-files
          path: artifact/

      - name: Deploy to MongoDB
        env:
          MONGO_HOST: ${{ secrets.MONGO_HOST }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        run: python Deploy_to_mongo.py